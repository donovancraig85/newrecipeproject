<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Cookbook | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=26"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><nav><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a href="meal-planner.html">Meal Planner</a><a href="grocery.html">Grocery List</a><a href="pantry.html">Pantry</a><a class="active" href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Family Members</a></nav><div class="header-account"><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div></section><section id="book" class="hidden page-panel"><div class="page-title"><h1>Family Cookbook</h1><p>Create a printable cookbook from the family recipe collection.</p></div><div class="row cookbook-tools"><select id="bookCategory"><option value="All">All Recipes</option><option>Dinner</option><option>Breakfast</option><option>Lunch</option><option>Dessert</option><option>Appetizer</option><option>Side Dish</option><option>Holiday</option><option>Other</option></select><button id="buildBook">Build Cookbook</button><button id="printBook" class="alt">Print / Save PDF</button></div><div id="bookPages"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,data=[];$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('book').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const p=await getDoc(doc(db,'users',u.uid)),role=p.exists()?p.data().role:'member';$('adminNav').classList.toggle('hidden',role!=='admin');data=(await getDocs(collection(db,'recipes'))).docs.map(d=>({id:d.id,...d.data()}));build()});function build(){const cat=$('bookCategory').value,items=data.filter(x=>cat==='All'||x.category===cat);$('bookPages').innerHTML='<div class="book-cover"><h1>Craigs</h1><h2>Family Cookbook</h2><p>Our favorite recipes</p></div>';items.sort((a,b)=>(a.title||'').localeCompare(b.title||'')).forEach(x=>{const a=document.createElement('article');a.className='book-recipe';a.innerHTML='<h2></h2><div class="book-meta"></div><h3>Ingredients</h3><div class="pre book-ing"></div><h3>Instructions</h3><div class="pre book-ins"></div>';a.querySelector('h2').textContent=x.title;a.querySelector('.book-meta').textContent=[x.category,x.servings&&'Serves '+x.servings,x.originalAuthor&&'From '+x.originalAuthor].filter(Boolean).join(' • ');a.querySelector('.book-ing').textContent=x.ingredients||'';a.querySelector('.book-ins').textContent=x.instructions||'';$('bookPages').append(a)})}$('buildBook').onclick=build;$('printBook').onclick=()=>window.print();</script></body></html>
