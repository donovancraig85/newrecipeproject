<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Cookbook | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=46"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><nav><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a href="meal-planner.html">Meal Planner</a><a href="grocery.html">Grocery List</a><a href="pantry.html">Pantry</a><a class="active" href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Administrator</a></nav><div class="header-account"><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div></section><section id="book" class="hidden page-panel"><div class="page-title"><h1>Family Cookbook</h1><p>Create a printable cookbook from the family recipe collection.</p></div><div class="row cookbook-tools"><select id="bookCategory"><option value="All">All Recipes</option><option>Dinner</option><option>Breakfast</option><option>Lunch</option><option>Dessert</option><option>Appetizer</option><option>Side Dish</option><option>Holiday</option><option>Other</option></select><button id="buildBook">Build Cookbook</button><button id="printBook" class="alt">Print / Save PDF</button></div><div id="bookPages"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,data=[];$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('book').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const p=await getDoc(doc(db,'users',u.uid)),role=p.exists()?p.data().role:'member';$('adminNav').classList.toggle('hidden',role!=='admin');data=(await getDocs(collection(db,'recipes'))).docs.map(d=>({id:d.id,...d.data()}));build()});function build(){const cat=$('bookCategory').value,items=data.filter(x=>cat==='All'||x.category===cat);$('bookPages').innerHTML='<div class="book-cover"><h1>Craigs</h1><h2>Family Cookbook</h2><p>Our favorite recipes</p></div>';items.sort((a,b)=>(a.title||'').localeCompare(b.title||'')).forEach(x=>{const a=document.createElement('article');a.className='book-recipe';a.innerHTML='<h2></h2><div class="book-meta"></div><h3>Ingredients</h3><div class="pre book-ing"></div><h3>Instructions</h3><div class="pre book-ins"></div>';a.querySelector('h2').textContent=x.title;a.querySelector('.book-meta').textContent=[x.category,x.servings&&'Serves '+x.servings,x.originalAuthor&&'From '+x.originalAuthor].filter(Boolean).join(' • ');a.querySelector('.book-ing').textContent=x.ingredients||'';a.querySelector('.book-ins').textContent=x.instructions||'';$('bookPages').append(a)})}$('buildBook').onclick=build;$('printBook').onclick=()=>{const category=$('bookCategory').value;const items=data.filter(x=>category==='All'||x.category===category).sort((a,b)=>(a.title||'').localeCompare(b.title||''));const esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const recipes=items.map(x=>`<article class="recipe"><h2>${esc(x.title)}</h2><p class="meta">${esc([x.category,x.servings&&'Serves '+x.servings,x.originalAuthor&&'From '+x.originalAuthor].filter(Boolean).join(' • '))}</p><h3>Ingredients</h3><div class="pre">${esc(x.ingredients)}</div><h3>Instructions</h3><div class="pre">${esc(x.instructions)}</div></article>`).join('');const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><title>Craigs Family Cookbook</title><style>@page{size:auto;margin:.6in}body{font-family:Georgia,'Times New Roman',serif;color:#122f43;margin:0}.cover{height:8.5in;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;break-after:page}.cover h1{font-size:64pt;margin:0}.cover h2{font:14pt Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase}.recipe{break-after:page}.recipe h2{font-size:27pt;border-bottom:1px solid #c7b9a4;padding-bottom:10px}.recipe h3{font:700 12pt Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-top:24px}.meta{font:10pt Arial,sans-serif;color:#68727a}.pre{white-space:pre-wrap;font:11pt/1.55 Arial,sans-serif}</style></head><body><section class="cover"><h1>Craigs</h1><h2>Family Cookbook</h2><p>Our favorite recipes</p></section>${recipes}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};</script></body></html>
