<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=45"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><button id="mobileMenuButton" class="mobile-menu-button" type="button" aria-label="Menu" aria-expanded="false">☰</button><nav id="siteNav"><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a href="meal-planner.html">Meal Planner</a><a href="grocery.html">Grocery List</a><a class="active" href="pantry.html">Pantry</a><a href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Administrator</a></nav><div class="header-account"><div id="topWho" class="top-who"></div><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div><p id="loginMsg"></p></section><section id="pantry" class="hidden page-panel"><div class="page-title"><h1>Pantry</h1><p>Track ingredients you already have at home.</p></div><div class="row grocery-add"><input id="newItem" placeholder="Add an item"><button id="addItem">Add</button><button id="clearChecked" class="alt">Clear Checked</button></div><p id="pantryMsg" class="muted"></p><div id="pantryList" class="grocery-list"></div><div class="pantry-match"><h2>What Can I Make?</h2><p class="muted">Compares the words in your pantry items with recipe ingredient lines.</p><button id="findRecipes" class="alt">Find Recipes</button><div id="pantryMatches" class="grid"></div></div></section></main><script type="module">const mobileMenuButton=document.getElementById('mobileMenuButton'),siteNav=document.getElementById('siteNav');if(mobileMenuButton&&siteNav){mobileMenuButton.onclick=()=>{const open=siteNav.classList.toggle('mobile-open');mobileMenuButton.setAttribute('aria-expanded',String(open));mobileMenuButton.textContent=open?'×':'☰'};siteNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>siteNav.classList.remove('mobile-open')));}
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,recipeData=[];
$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value).catch(e=>$('loginMsg').textContent=e.message);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('pantry').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const p=await getDoc(doc(db,'users',u.uid)),role=p.exists()?p.data().role:'member';$('topWho').textContent=u.email+' • '+(role==='admin'?'Administrator':'Family Member');$('adminNav').classList.toggle('hidden',role!=='admin');recipeData=(await getDocs(collection(db,'recipes'))).docs.map(d=>({id:d.id,...d.data()}));loadList()});
async function loadList(){const snap=await getDocs(collection(db,'users',user.uid,'pantryItems'));$('pantryList').innerHTML='';snap.forEach(d=>{const x=d.data(),row=document.createElement('label');row.className='grocery-row';row.innerHTML='<input type="checkbox"><span></span><button type="button" class="danger">Delete</button>';row.querySelector('input').checked=!!x.checked;row.querySelector('span').textContent=x.text;row.querySelector('input').onchange=async e=>{await setDoc(d.ref,{...x,checked:e.target.checked,updatedAt:serverTimestamp()});loadList()};row.querySelector('button').onclick=async()=>{await deleteDoc(d.ref);loadList()};$('pantryList').append(row)})}$('addItem').onclick=async()=>{const text=$('newItem').value.trim();if(!text){$('pantryMsg').textContent='Enter a pantry item first.';return}try{$('pantryMsg').textContent='Adding...';await setDoc(doc(db,'users',user.uid,'pantryItems',String(Date.now())),{text,checked:false,updatedAt:serverTimestamp()});$('newItem').value='';$('pantryMsg').textContent='Item added.';await loadList()}catch(err){$('pantryMsg').textContent='Could not add item: '+err.message}};$('newItem').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addItem').click()}});$('clearChecked').onclick=async()=>{const s=await getDocs(collection(db,'users',user.uid,'pantryItems'));for(const d of s.docs)if(d.data().checked)await deleteDoc(d.ref);loadList()};
$('findRecipes').onclick=async()=>{const snap=await getDocs(collection(db,'users',user.uid,'pantryItems'));const have=snap.docs.map(d=>(d.data().text||'').toLowerCase());$('pantryMatches').innerHTML='';recipeData.map(r=>{const ing=(r.ingredients||'').split(/\n/).filter(Boolean);const matched=ing.filter(line=>have.some(h=>h&&line.toLowerCase().includes(h))).length;return{r,matched,total:ing.length}}).filter(x=>x.matched>0).sort((a,b)=>b.matched-a.matched).slice(0,12).forEach(x=>{const c=document.createElement('a');c.className='card pantry-recipe-link';c.href='recipes.html?open='+encodeURIComponent(x.r.id);c.innerHTML='<div class="card-body"><small></small><h3></h3><div class="muted"></div><span class="open-recipe-label">Open Recipe →</span></div>';c.querySelector('small').textContent=x.r.category||'Other';c.querySelector('h3').textContent=x.r.title;c.querySelector('.muted').textContent=x.matched+' of '+x.total+' ingredient lines match pantry items';$('pantryMatches').append(c)})};</script></body></html>
