<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Planner | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=30"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><button id="mobileMenuButton" class="mobile-menu-button" type="button" aria-label="Menu" aria-expanded="false">☰</button><nav id="siteNav"><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a class="active" href="meal-planner.html">Meal Planner</a><a href="grocery.html">Grocery List</a><a href="pantry.html">Pantry</a><a href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Family Members</a></nav><div class="header-account"><div id="topWho" class="top-who"></div><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div><p id="loginMsg"></p></section><section id="planner" class="hidden page-panel"><div class="page-title"><h1>Weekly Meal Planner</h1><p>Choose recipes for the week, then add their ingredients to your grocery list.</p></div><div id="weekGrid" class="week-grid"></div><div class="row"><button id="savePlan">Save Meal Plan</button><button id="planToList" class="alt">Add Planned Meals to Grocery List</button></div><p id="planMsg" class="muted"></p></section></main><script type="module">const mobileMenuButton=document.getElementById('mobileMenuButton'),siteNav=document.getElementById('siteNav');if(mobileMenuButton&&siteNav){mobileMenuButton.onclick=()=>{const open=siteNav.classList.toggle('mobile-open');mobileMenuButton.setAttribute('aria-expanded',String(open));mobileMenuButton.textContent=open?'×':'☰'};siteNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>siteNav.classList.remove('mobile-open')));}
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,recipes=[];const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value).catch(e=>$('loginMsg').textContent=e.message);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();
onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('planner').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const profile=await getDoc(doc(db,'users',u.uid));const role=profile.exists()?profile.data().role:'member';$('topWho').textContent=u.email+' • '+(role==='admin'?'Administrator':'Family Member');$('adminNav').classList.toggle('hidden',role!=='admin');recipes=(await getDocs(collection(db,'recipes'))).docs.map(d=>({id:d.id,...d.data()}));drawPlanner()});
async function drawPlanner(){const saved=await getDoc(doc(db,'users',user.uid,'mealPlans','current'));const plan=saved.exists()?(saved.data().days||{}):{};$('weekGrid').innerHTML='';days.forEach(day=>{const card=document.createElement('div');card.className='day-card';const select=document.createElement('select');select.dataset.day=day;select.innerHTML='<option value="">No meal selected</option>';recipes.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.title;o.selected=plan[day]===r.id;select.append(o)});const h=document.createElement('h3');h.textContent=day;card.append(h,select);$('weekGrid').append(card)})}
$('savePlan').onclick=async()=>{const values={};document.querySelectorAll('[data-day]').forEach(s=>values[s.dataset.day]=s.value);await setDoc(doc(db,'users',user.uid,'mealPlans','current'),{days:values,updatedAt:serverTimestamp()});$('planMsg').textContent='Meal plan saved.'};
$('planToList').onclick=async()=>{const ids=[...document.querySelectorAll('[data-day]')].map(s=>s.value).filter(Boolean);const lines=recipes.filter(r=>ids.includes(r.id)).flatMap(r=>(r.ingredients||'').split(/\n/).map(x=>x.trim()).filter(Boolean));let n=0;for(const line of lines){await setDoc(doc(db,'users',user.uid,'groceryItems',String(Date.now())+'-'+n++),{text:line,checked:false,updatedAt:serverTimestamp()})}$('planMsg').textContent='Ingredients added to Grocery List.'};
</script></body></html>
