<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Planner | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=42"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><button id="mobileMenuButton" class="mobile-menu-button" type="button" aria-label="Menu" aria-expanded="false">☰</button><nav id="siteNav"><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a class="active" href="meal-planner.html">Meal Planner</a><a href="grocery.html">Grocery List</a><a href="pantry.html">Pantry</a><a href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Administrator</a></nav><div class="header-account"><div id="topWho" class="top-who"></div><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div><p id="loginMsg"></p></section><section id="planner" class="hidden page-panel"><div class="planner-heading"><div><h1>Monthly Meal Planner</h1><p>Plan a main dish and up to three sides for each day.</p></div><div class="month-nav"><button id="prevMonth" class="alt">←</button><h2 id="monthLabel"></h2><button id="nextMonth" class="alt">→</button></div></div><div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="monthGrid" class="month-grid"></div><div class="planner-actions"><button id="savePlan">Save Month</button><button id="copyWeek" class="alt">Copy First Planned Week Forward</button><button id="clearMonth" class="alt">Clear Month</button><button id="planToList" class="alt">Add Month to Grocery List</button></div><p id="planMsg" class="muted"></p></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,recipes=[],viewDate=new Date(),plan={};const menu=$('mobileMenuButton'),nav=$('siteNav');menu.onclick=()=>{const o=nav.classList.toggle('mobile-open');menu.setAttribute('aria-expanded',String(o));menu.textContent=o?'×':'☰'};$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value).catch(e=>$('loginMsg').textContent=e.message);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('planner').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const profile=await getDoc(doc(db,'users',u.uid)),role=String(profile.exists()?profile.data().role:'member').toLowerCase();$('topWho').textContent=u.email+' • '+(role==='admin'||role==='administrator'?'Administrator':'Family Member');$('adminNav').classList.toggle('hidden',!(role==='admin'||role==='administrator'));recipes=(await getDocs(collection(db,'recipes'))).docs.map(d=>({id:d.id,...d.data()}));await loadMonth()});function monthKey(){return viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0')}async function loadMonth(){const snap=await getDoc(doc(db,'users',user.uid,'mealPlans',monthKey()));plan=snap.exists()?(snap.data().days||{}):{};drawMonth()}function optionList(selected,kind){const list=kind==='side'?recipes.filter(r=>['Side Dish','Appetizer','Other'].includes(r.category||'Other')):recipes.filter(r=>!['Dessert'].includes(r.category));return ['<option value="">None</option>',...list.map(r=>`<option value="${r.id}" ${selected===r.id?'selected':''}>${r.title}</option>`)].join('')}function drawMonth(){$('monthLabel').textContent=viewDate.toLocaleString(undefined,{month:'long',year:'numeric'});const y=viewDate.getFullYear(),m=viewDate.getMonth(),days=new Date(y,m+1,0).getDate(),start=new Date(y,m,1).getDay();$('monthGrid').innerHTML='';for(let i=0;i<start;i++){const blank=document.createElement('div');blank.className='month-day blank';$('monthGrid').append(blank)}for(let d=1;d<=days;d++){const key=String(d),meal=plan[key]||{};const c=document.createElement('div');c.className='month-day';c.innerHTML=`<div class="day-number">${d}</div><label>Main<select data-day="${d}" data-slot="main">${optionList(meal.main,'main')}</select></label><label>Side 1<select data-day="${d}" data-slot="side1">${optionList(meal.side1,'side')}</select></label><label>Side 2<select data-day="${d}" data-slot="side2">${optionList(meal.side2,'side')}</select></label><label>Side 3<select data-day="${d}" data-slot="side3">${optionList(meal.side3,'side')}</select></label><div class="day-actions"><button type="button" class="open-main alt">Open Main</button><button type="button" class="copy-prev alt">Copy Previous</button><button type="button" class="clear-day alt">Clear</button></div>`;c.querySelector('.open-main').onclick=()=>{const id=c.querySelector('[data-slot=main]').value;if(id)location.href='recipes.html?open='+encodeURIComponent(id)};c.querySelector('.copy-prev').onclick=()=>{const prev=$('monthGrid').querySelector(`[data-day="${d-1}"]`);if(!prev)return;['main','side1','side2','side3'].forEach(slot=>{c.querySelector(`[data-slot="${slot}"]`).value=prev.closest('.month-day').querySelector(`[data-slot="${slot}"]`).value})};c.querySelector('.clear-day').onclick=()=>c.querySelectorAll('select').forEach(x=>x.value='');$('monthGrid').append(c)}}function gather(){const days={};document.querySelectorAll('#monthGrid select').forEach(s=>{days[s.dataset.day]??={};days[s.dataset.day][s.dataset.slot]=s.value});return days}$('prevMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);await loadMonth()};$('nextMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);await loadMonth()};$('savePlan').onclick=async()=>{plan=gather();await setDoc(doc(db,'users',user.uid,'mealPlans',monthKey()),{days:plan,month:monthKey(),updatedAt:serverTimestamp()});$('planMsg').textContent='Month saved.'};$('clearMonth').onclick=()=>{if(confirm('Clear every meal in this month?'))document.querySelectorAll('#monthGrid select').forEach(s=>s.value='')};$('copyWeek').onclick=()=>{const values=gather(),planned=Object.keys(values).map(Number).filter(d=>Object.values(values[d]).some(Boolean)).sort((a,b)=>a-b);if(!planned.length)return;const start=planned[0];for(let target=start+7;target<=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate();target++){const src=start+((target-start)%7),source=values[src];if(!source)continue;['main','side1','side2','side3'].forEach(slot=>{const el=document.querySelector(`[data-day="${target}"][data-slot="${slot}"]`);if(el)el.value=source[slot]||''})}};$('planToList').onclick=async()=>{const days=gather(),ids=Object.values(days).flatMap(x=>Object.values(x)).filter(Boolean),selected=recipes.filter(r=>ids.includes(r.id));let n=0;for(const r of selected)for(const text of (r.ingredients||'').split(/\n/).map(x=>x.trim()).filter(Boolean))await setDoc(doc(db,'users',user.uid,'groceryItems',Date.now()+'-'+n++),{text,checked:false,source:'Meal Planner',updatedAt:serverTimestamp()});$('planMsg').textContent='Planned meal ingredients added to Grocery List.'};
</script></body></html>
