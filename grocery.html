<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grocery List | Craigs Family Cookbook</title><link rel="stylesheet" href="styles.css?v=46"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>Craigs</strong><span>FAMILY COOKBOOK</span></a><button id="mobileMenuButton" class="mobile-menu-button" type="button" aria-label="Menu" aria-expanded="false">☰</button><nav id="siteNav"><a href="index.html">Home</a><a href="recipes.html">Recipes</a><a href="favorites.html">My Favorites</a><a href="meal-planner.html">Meal Planner</a><a class="active" href="grocery.html">Grocery List</a><a href="pantry.html">Pantry</a><a href="cookbook.html">Cookbook</a><a id="adminNav" class="hidden" href="admin.html">Administrator</a></nav><div class="header-account"><div id="topWho" class="top-who"></div><button id="authButton" class="auth-button">Sign In</button></div></header><main><section id="login" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button></div><p id="loginMsg"></p></section><section id="grocery" class="hidden page-panel"><div class="page-title"><h1>Grocery List</h1><p>Your personal shopping list.</p></div><div class="row grocery-add"><input id="newItem" placeholder="Add an item"><button id="addItem">Add</button><button id="clearChecked" class="alt">Clear Checked</button><button id="repairList" class="alt">Repair List</button></div><div id="groceryList" class="grocery-list"></div></section></main><script type="module">const mobileMenuButton=document.getElementById('mobileMenuButton'),siteNav=document.getElementById('siteNav');if(mobileMenuButton&&siteNav){mobileMenuButton.onclick=()=>{const open=siteNav.classList.toggle('mobile-open');mobileMenuButton.setAttribute('aria-expanded',String(open));mobileMenuButton.textContent=open?'×':'☰'};siteNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>siteNav.classList.remove('mobile-open')));}
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user;
$('signin').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value).catch(e=>$('loginMsg').textContent=e.message);$('authButton').onclick=()=>user?signOut(auth):$('login').scrollIntoView();onAuthStateChanged(auth,async u=>{user=u;$('login').classList.toggle('hidden',!!u);$('grocery').classList.toggle('hidden',!u);$('authButton').textContent=u?'Sign Out':'Sign In';if(!u)return;const p=await getDoc(doc(db,'users',u.uid)),role=p.exists()?p.data().role:'member';$('topWho').textContent=u.email+' • '+(role==='admin'?'Administrator':'Family Member');$('adminNav').classList.toggle('hidden',role!=='admin');loadList()});
function splitMalformedIngredient(text){const raw=String(text||'').trim();const parts=raw.split(/(?=(?:Cake|Syrup|Frosting|Dough|Filling|Sauce|Toppings?)\s*(?=\d|[¼½¾⅓⅔⅛]))/i);if(parts.length<2)return null;return parts.map(x=>x.replace(/^(?:Cake|Syrup|Frosting|Dough|Filling|Sauce|Toppings?)\s*/i,'').trim()).filter(Boolean)}async function repairGroceryList(){const snap=await getDocs(collection(db,'users',user.uid,'groceryItems'));let repaired=0;for(const item of snap.docs){const x=item.data(),parts=splitMalformedIngredient(x.text);if(!parts)continue;await deleteDoc(item.ref);for(let i=0;i<parts.length;i++)await setDoc(doc(db,'users',user.uid,'groceryItems',Date.now()+'-repair-'+repaired+'-'+i),{text:parts[i],checked:!!x.checked,source:x.source&&x.source!=='Manual'?x.source:'Repaired Recipe Ingredient',updatedAt:serverTimestamp()});repaired++}return repaired}async function loadList(){const snap=await getDocs(collection(db,'users',user.uid,'groceryItems'));const docs=snap.docs,groups={Produce:[],Meat:[],Dairy:[],Bakery:[],Frozen:[],Pantry:[],Other:[]};const category=t=>{/\b(chicken|beef|pork|turkey|sausage|bacon|fish|salmon)\b/i.test(t)?0:0;return /\b(chicken|beef|pork|turkey|sausage|bacon|fish|salmon)\b/i.test(t)?'Meat':/\b(milk|cream|cheese|butter|egg|yogurt)\b/i.test(t)?'Dairy':/\b(onion|garlic|pepper|lettuce|tomato|potato|carrot|lemon|lime|apple|banana|cilantro|parsley)\b/i.test(t)?'Produce':/\b(bread|roll|tortilla|bun)\b/i.test(t)?'Bakery':/\b(frozen|ice cream)\b/i.test(t)?'Frozen':/\b(flour|sugar|salt|oil|rice|pasta|spice|syrup|vanilla|baking|can |canned)\b/i.test(t)?'Pantry':'Other'};const seen=new Map();docs.forEach(d=>{const x=d.data(),key=(x.text||'').toLowerCase().replace(/\s+/g,' ').trim();if(seen.has(key)){const existing=seen.get(key);existing.sources.add(x.source||'Recipe');existing.dupes.push(d);return}const item={d,x,sources:new Set([x.source||'Manual']),dupes:[]};seen.set(key,item);groups[category(x.text||'')].push(item)});$('groceryList').innerHTML='';Object.entries(groups).forEach(([name,items])=>{if(!items.length)return;const h=document.createElement('h3');h.className='grocery-section-title';h.textContent=name;$('groceryList').append(h);items.forEach(item=>{const {d,x}=item,row=document.createElement('label');row.className='grocery-row';row.innerHTML='<input type="checkbox"><span></span><small class="grocery-source"></small><button type="button" class="danger">Delete</button>';row.querySelector('input').checked=!!x.checked;row.querySelector('span').textContent=x.text;row.querySelector('.grocery-source').textContent='From: '+[...item.sources].join(', ')+(item.dupes.length?' • duplicates combined':'');row.querySelector('input').onchange=async e=>{await setDoc(d.ref,{...x,checked:e.target.checked,updatedAt:serverTimestamp()});loadList()};row.querySelector('button').onclick=async()=>{await deleteDoc(d.ref);for(const dup of item.dupes)await deleteDoc(dup.ref);loadList()};$('groceryList').append(row)})})}$('addItem').onclick=async()=>{const text=$('newItem').value.trim();if(!text)return;await setDoc(doc(db,'users',user.uid,'groceryItems',String(Date.now())),{text,checked:false,source:'Manual',updatedAt:serverTimestamp()});$('newItem').value='';loadList()};$('repairList').onclick=async()=>{const count=await repairGroceryList();$('groceryMsg').textContent=count?count+' malformed grocery item'+(count===1?' was':'s were')+' repaired.':'No malformed grocery items were found.';loadList()};$('clearChecked').onclick=async()=>{const s=await getDocs(collection(db,'users',user.uid,'groceryItems'));for(const d of s.docs)if(d.data().checked)await deleteDoc(d.ref);loadList()};
</script></body></html>
