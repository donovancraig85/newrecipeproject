<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Family Cookbook</title>
<style>
:root{--ink:#2f2925;--brown:#654838;--accent:#9b5d3e;--cream:#faf7f2;--paper:#fff;--line:#e6ddd4;--muted:#786d66}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}header{padding:30px 6%;background:var(--brown);color:white}header h1{margin:0}main{max-width:1100px;margin:auto;padding:24px}.panel,.card{background:var(--paper);border-radius:16px;box-shadow:0 4px 18px #00000010}.panel{padding:22px;margin-bottom:20px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.hidden{display:none!important}input,textarea,select,button{font:inherit}input,textarea,select{padding:11px;border:1px solid #d4c8bd;border-radius:9px;background:white}input,select{min-height:44px}textarea{width:100%;resize:vertical}button{border:0;border-radius:9px;padding:11px 16px;background:var(--accent);color:white;cursor:pointer}.alt{background:#eee3d8;color:#4d392d}.danger{background:#9c3d36}.search{width:min(100%,560px)}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.cat{background:#eee3d8;color:#4d392d}.cat.active{background:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{overflow:hidden;cursor:pointer}.thumb{height:150px;background:#eee7df;display:grid;place-items:center;color:#806f64;font-size:42px}.thumb img{width:100%;height:100%;object-fit:cover}.cardBody{padding:16px}.card h3{margin:4px 0 8px}.muted,small{color:var(--muted)}.detailHero{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:24px}.heroImage{width:100%;height:280px;object-fit:cover;border-radius:14px;background:#eee7df}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.pre{white-space:pre-wrap;line-height:1.6}.comment{border-top:1px solid var(--line);padding:12px 0}.comment strong{display:block}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formGrid label{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}dialog{border:0;border-radius:18px;max-width:780px;width:min(94%,780px);padding:24px}dialog::backdrop{background:#0009}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.gallery img{width:100%;height:120px;object-fit:cover;border-radius:10px}@media(max-width:720px){.detailHero{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><h1>Our Family Cookbook</h1><p>Private recipes, stories, and memories.</p></header><main>
<section id="loginPanel" class="panel"><h2>Family Sign In</h2><p class="muted">Access is limited to family accounts created by the cookbook administrator.</p><div class="row"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn">Sign In</button></div><p id="loginStatus"></p></section>
<section id="library" class="hidden">
<div class="panel"><div class="row between"><div><h2>Recipe Library</h2><div id="who" class="muted"></div></div><div class="row"><button id="addRecipe">+ Add Recipe</button><button id="signOut" class="alt">Sign Out</button></div></div><div class="row"><input id="search" class="search" type="search" placeholder="Search names, categories, ingredients, or notes..."></div><div id="categories" class="cats"></div></div>
<div id="recipeGrid" class="grid"></div>
</section>
<section id="detail" class="hidden"><button id="back" class="alt">← Back to recipes</button><div class="panel" style="margin-top:14px"><div class="row between"><div><small id="detailCategory"></small><h2 id="detailTitle"></h2><div id="detailMeta" class="muted"></div></div><button id="editRecipe">Edit Recipe</button></div><div class="detailHero section"><div><img id="mainPhoto" class="heroImage hidden" alt="Recipe"><div id="photoPlaceholder" class="heroImage" style="display:grid;place-items:center;font-size:54px">🍲</div><div id="gallery" class="gallery" style="margin-top:10px"></div></div><div><h3>Description</h3><div id="detailDescription" class="pre muted"></div><h3>Family Notes</h3><div id="detailNotes" class="pre muted"></div><p><a id="originalFile" target="_blank" rel="noopener">Open Original File</a></p></div></div><div class="section"><h3>Ingredients</h3><div id="detailIngredients" class="pre"></div></div><div class="section"><h3>Instructions</h3><div id="detailInstructions" class="pre"></div></div><div class="section"><h3>Family Comments</h3><div class="row"><input id="commentText" class="search" placeholder="Add a comment or cooking tip..."><button id="addComment">Post Comment</button></div><div id="comments"></div></div></div></section>
</main>
<dialog id="recipeDialog"><form id="recipeForm"><h2 id="formTitle">Add Recipe</h2><div class="formGrid"><label>Recipe name<input id="fTitle" required></label><label>Category<select id="fCategory"><option>Breakfast</option><option>Lunch</option><option selected>Dinner</option><option>Dessert</option><option>Appetizer</option><option>Side Dish</option><option>Bread</option><option>Soup</option><option>Drink</option><option>Holiday</option><option>Family Favorite</option><option>Other</option></select></label><label>Original author/source<input id="fAuthor" placeholder="Grandma, cookbook, website..."></label><label>Contributor<input id="fContributor" placeholder="Family member who shared it"></label><label>Prep time<input id="fPrep" placeholder="20 minutes"></label><label>Cook time<input id="fCook" placeholder="45 minutes"></label><label>Servings<input id="fServings" placeholder="8"></label><label>Original recipe file<input id="fFile" type="file" accept=".pdf,.doc,.docx,.txt,image/*"></label><label class="full">Description<textarea id="fDescription" rows="3"></textarea></label><label class="full">Ingredients, one per line<textarea id="fIngredients" rows="7"></textarea></label><label class="full">Instructions, one step per line<textarea id="fInstructions" rows="8"></textarea></label><label class="full">Family notes<textarea id="fNotes" rows="4"></textarea></label><label class="full">Add pictures<input id="fPhotos" type="file" accept="image/*" multiple></label></div><p id="formStatus"></p><div class="row"><button type="submit">Save Recipe</button><button id="cancelForm" type="button" class="alt">Cancel</button></div></form></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,collection,addDoc,getDocs,doc,getDoc,setDoc,updateDoc,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);const $=id=>document.getElementById(id);let user=null,recipes=[],activeCategory='All',activeRecipe=null,editingId=null;
const val=id=>$(id).value.trim();
$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in...';await signInWithEmailAndPassword(auth,val('email'),val('password'))}catch(e){$('loginStatus').textContent=e.message}};
$('signOut').onclick=()=>signOut(auth);$('back').onclick=showLibrary;$('addRecipe').onclick=()=>openForm();$('cancelForm').onclick=()=>recipeDialog.close();$('search').oninput=renderLibrary;
onAuthStateChanged(auth,async u=>{user=u;$('loginPanel').classList.toggle('hidden',!!u);$('library').classList.toggle('hidden',!u);$('detail').classList.add('hidden');if(u){$('who').textContent=u.email;await loadRecipes()}else{$('loginStatus').textContent='';recipes=[]}});
async function loadRecipes(){const snap=await getDocs(collection(db,'recipes'));recipes=snap.docs.map(d=>({id:d.id,...d.data()}));renderLibrary()}
function renderLibrary(){const q=$('search').value.toLowerCase();const cats=['All',...new Set(recipes.map(r=>r.category||'Uncategorized'))];$('categories').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='cat'+(c===activeCategory?' active':'');b.textContent=c;b.onclick=()=>{activeCategory=c;renderLibrary()};$('categories').appendChild(b)});const grid=$('recipeGrid');grid.innerHTML='';const filtered=recipes.filter(r=>(activeCategory==='All'||(r.category||'Uncategorized')===activeCategory)&&[r.title,r.category,r.ingredients,r.familyNotes,r.originalAuthor].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.title||'').localeCompare(b.title||''));if(!filtered.length){grid.innerHTML='<div class="panel">No matching recipes.</div>';return}filtered.forEach(r=>{const card=document.createElement('article');card.className='card';const thumb=document.createElement('div');thumb.className='thumb';if(r.photoUrls?.[0]){const img=document.createElement('img');img.src=r.photoUrls[0];img.alt='';thumb.appendChild(img)}else thumb.textContent='🍲';const body=document.createElement('div');body.className='cardBody';const cat=document.createElement('small');cat.textContent=r.category||'Uncategorized';const h=document.createElement('h3');h.textContent=r.title||'Untitled Recipe';const meta=document.createElement('div');meta.className='muted';meta.textContent=r.originalAuthor?`From ${r.originalAuthor}`:'';body.append(cat,h,meta);card.append(thumb,body);card.onclick=()=>openDetail(r.id);grid.appendChild(card)})}
function showLibrary(){history.replaceState(null,'',location.pathname);$('detail').classList.add('hidden');$('library').classList.remove('hidden')}
async function openDetail(id){const snap=await getDoc(doc(db,'recipes',id));if(!snap.exists())return;activeRecipe={id:snap.id,...snap.data()};$('library').classList.add('hidden');$('detail').classList.remove('hidden');history.replaceState(null,'',`#recipe=${id}`);$('detailTitle').textContent=activeRecipe.title||'Untitled Recipe';$('detailCategory').textContent=activeRecipe.category||'Uncategorized';$('detailMeta').textContent=[activeRecipe.originalAuthor&&`Original: ${activeRecipe.originalAuthor}`,activeRecipe.contributor&&`Shared by: ${activeRecipe.contributor}`,activeRecipe.prepTime&&`Prep: ${activeRecipe.prepTime}`,activeRecipe.cookTime&&`Cook: ${activeRecipe.cookTime}`,activeRecipe.servings&&`Serves: ${activeRecipe.servings}`].filter(Boolean).join(' • ');$('detailDescription').textContent=activeRecipe.description||'No description yet.';$('detailNotes').textContent=activeRecipe.familyNotes||'No family notes yet.';$('detailIngredients').textContent=activeRecipe.ingredients||'No ingredients entered.';$('detailInstructions').textContent=numberSteps(activeRecipe.instructions);$('originalFile').classList.toggle('hidden',!activeRecipe.fileUrl);if(activeRecipe.fileUrl)$('originalFile').href=activeRecipe.fileUrl;renderPhotos(activeRecipe.photoUrls||[]);await loadComments()}
function numberSteps(text=''){return text.split('\n').filter(Boolean).map((x,i)=>`${i+1}. ${x.replace(/^\d+[.)]\s*/, '')}`).join('\n\n')||'No instructions entered.'}
function renderPhotos(urls){$('gallery').innerHTML='';$('mainPhoto').classList.toggle('hidden',!urls.length);$('photoPlaceholder').classList.toggle('hidden',!!urls.length);if(urls.length){$('mainPhoto').src=urls[0];urls.slice(1).forEach(url=>{const i=document.createElement('img');i.src=url;i.alt='Recipe photo';$('gallery').appendChild(i)})}}
$('editRecipe').onclick=()=>openForm(activeRecipe);
function openForm(r=null){editingId=r?.id||null;$('formTitle').textContent=r?'Edit Recipe':'Add Recipe';$('recipeForm').reset();$('fCategory').value=r?.category||'Dinner';for(const [id,key] of [['fTitle','title'],['fAuthor','originalAuthor'],['fContributor','contributor'],['fPrep','prepTime'],['fCook','cookTime'],['fServings','servings'],['fDescription','description'],['fIngredients','ingredients'],['fInstructions','instructions'],['fNotes','familyNotes']])$(id).value=r?.[key]||'';$('formStatus').textContent='';recipeDialog.showModal()}
async function uploadFile(file,path){const fileRef=ref(storage,path);await uploadBytes(fileRef,file,{contentType:file.type||'application/octet-stream'});return {path:fileRef.fullPath,url:await getDownloadURL(fileRef)}}
$('recipeForm').onsubmit=async e=>{e.preventDefault();try{$('formStatus').textContent='Saving...';let id=editingId||doc(collection(db,'recipes')).id;let existing=editingId?(await getDoc(doc(db,'recipes',id))).data()||{}:{};let filePath=existing.filePath||'',fileUrl=existing.fileUrl||'';const file=$('fFile').files[0];if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await uploadFile(file,`recipeFiles/${id}/${Date.now()}-${safe}`);filePath=up.path;fileUrl=up.url}const photoPaths=[...(existing.photoPaths||[])],photoUrls=[...(existing.photoUrls||[])];for(const photo of $('fPhotos').files){const safe=photo.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await uploadFile(photo,`recipePhotos/${id}/${Date.now()}-${safe}`);photoPaths.push(up.path);photoUrls.push(up.url)}const data={title:val('fTitle'),category:$('fCategory').value,originalAuthor:val('fAuthor'),contributor:val('fContributor'),prepTime:val('fPrep'),cookTime:val('fCook'),servings:val('fServings'),description:val('fDescription'),ingredients:val('fIngredients'),instructions:val('fInstructions'),familyNotes:val('fNotes'),filePath,fileUrl,photoPaths,photoUrls,updatedBy:user.uid,updatedAt:serverTimestamp()};if(editingId)await updateDoc(doc(db,'recipes',id),data);else await setDoc(doc(db,'recipes',id),{...data,createdBy:user.uid,createdAt:serverTimestamp()});recipeDialog.close();await loadRecipes();await openDetail(id)}catch(err){$('formStatus').textContent=err.message}};
$('addComment').onclick=async()=>{const text=val('commentText');if(!text||!activeRecipe)return;await addDoc(collection(db,'recipes',activeRecipe.id,'comments'),{text,userId:user.uid,userEmail:user.email,createdAt:serverTimestamp()});$('commentText').value='';await loadComments()};
async function loadComments(){const box=$('comments');box.innerHTML='';try{const snap=await getDocs(query(collection(db,'recipes',activeRecipe.id,'comments'),orderBy('createdAt','desc')));if(snap.empty){box.innerHTML='<p class="muted">No comments yet.</p>';return}snap.forEach(d=>{const x=d.data(),div=document.createElement('div');div.className='comment';const who=document.createElement('strong');who.textContent=x.userEmail||'Family member';const text=document.createElement('div');text.textContent=x.text;div.append(who,text);box.appendChild(div)})}catch(e){box.textContent=e.message}}
</script></body></html>
