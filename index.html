<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Cookbook</title><style>body{font-family:system-ui;margin:0;background:#faf7f2;color:#2d2926}header{padding:38px 7%;background:#5f4636;color:#fff}main{max-width:950px;margin:auto;padding:28px 20px}.panel{background:#fff;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #d7ccc2}input{min-width:220px}button{border:0;background:#9b5d3e;color:#fff;cursor:pointer}.alt{background:#eee3d8;color:#4d392d}.hidden{display:none}.file{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:12px 0}.file a{color:#8a4e32;font-weight:600}small{color:#766}#status{white-space:pre-wrap}</style></head><body><header><h1>Our Family Cookbook</h1><p>Private family recipe storage</p></header><main>
<section id="authPanel" class="panel"><h2>Family Sign In</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button><button id="signup" class="alt">Create Account</button></div><p id="authStatus"><small>Not signed in.</small></p></section>
<section id="appPanel" class="panel hidden"><div class="row" style="justify-content:space-between"><div><h2>Recipe File Library</h2><div id="who"></div></div><button id="signout" class="alt">Sign Out</button></div><p>Upload PDFs, Word documents, text files, photos, or screenshots.</p><div class="row"><input id="file" type="file" accept=".pdf,.doc,.docx,.txt,image/*"><input id="newName" type="text" placeholder="Recipe name (optional)"><button id="upload">Upload Recipe File</button><button id="refresh" class="alt">Refresh Files</button></div><p id="status"></p><h3>Your Recipe Files</h3><div id="files"></div></section>
</main><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js';
import { firebaseConfig } from './firebase-config.js';
const app=initializeApp(firebaseConfig), auth=getAuth(app), storage=getStorage(app); const $=id=>document.getElementById(id); let user=null;
function status(t){$('status').textContent=t}
async function loadFiles(){if(!user)return; const box=$('files');box.innerHTML='<p>Loading recipe files...</p>';try{const folder=ref(storage,`recipeUploads`);const result=await listAll(folder);box.innerHTML='';if(!result.items.length){box.innerHTML='<p><small>No recipe files have been uploaded yet.</small></p>';return;}const items=[...result.items].sort((a,b)=>b.name.localeCompare(a.name));for(const item of items){const url=await getDownloadURL(item);const row=document.createElement('div');row.className='file';const name=document.createElement('span');name.textContent=item.name.replace(/^\d+-[^-]+-/,'');const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='Open / Download';row.append(name,link);box.appendChild(row)}}catch(e){box.textContent=`Unable to load recipe files: ${e.message}`}}
$('signup').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('authStatus').textContent=e.message}};
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('authStatus').textContent=e.message}};
$('signout').onclick=()=>signOut(auth);$('refresh').onclick=loadFiles;
onAuthStateChanged(auth,async u=>{user=u;$('appPanel').classList.toggle('hidden',!u);$('who').textContent=u?u.email:'';$('authStatus').innerHTML=u?'<small>Signed in.</small>':'<small>Not signed in.</small>';if(u)await loadFiles();else $('files').innerHTML=''});
$('upload').onclick=async()=>{const f=$('file').files[0];if(!user)return status('Sign in first.');if(!f)return status('Choose a file first.');try{status('Uploading '+f.name+'...');const originalExt=f.name.includes('.')?'.'+f.name.split('.').pop():'';const typed=$('newName').value.trim();const base=typed||(f.name.endsWith(originalExt)?f.name.slice(0,-originalExt.length):f.name);const safeBase=base.replace(/[^a-zA-Z0-9 _.-]/g,'').trim().replace(/\s+/g,'_')||'recipe';const safe=(safeBase.toLowerCase().endsWith(originalExt.toLowerCase())?safeBase:safeBase+originalExt);const fileRef=ref(storage,`recipeUploads/${Date.now()}-${user.uid}-${safe}`);await uploadBytes(fileRef,f,{contentType:f.type||'application/octet-stream'});status('Upload complete.');$('file').value='';$('newName').value='';await loadFiles()}catch(e){status(e.message)}};
</script></body></html>
